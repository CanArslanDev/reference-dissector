[project]
name = "reference-dissector"
version = "0.1.0"
description = "Take a reference track apart (tempo grid, tuning, drum hits, 808 notes, sounds) and rebuild it in Ableton Live through ableton-live-mcp"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Can Arslan" }]
keywords = ["music information retrieval", "ableton", "mcp", "drum transcription", "808", "sample identification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "soxr>=0.3",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "mido>=1.3",
]

[project.optional-dependencies]
# Building in Live goes through ableton-live-mcp's tools (it talks to Live's Remote Script)
live = ["ableton-live-mcp @ git+https://github.com/CanArslanDev/ableton-live-mcp@v2.2.0"]

[project.scripts]
refdissect = "refdissect.cli:main"

[project.urls]
Repository = "https://github.com/CanArslanDev/reference-dissector"
"Ableton Live MCP" = "https://github.com/CanArslanDev/ableton-live-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refdissect"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]
